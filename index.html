<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow • Modern To-Do List</title>
  <meta name="description" content="A clean, responsive, and intuitive To-Do List application to organize your daily tasks.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-background">
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
  </div>

  <main class="app-container">
    <header class="app-header">
      <div class="header-content">
        <div class="logo-badge">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 11 12 14 22 4"></polyline>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
          </svg>
        </div>
        <div>
          <h1>TaskFlow</h1>
          <p class="subtitle" id="currentDate">Stay organized and get things done</p>
        </div>
      </div>
    </header>

    <!-- Task Input Form -->
    <form id="todoForm" class="todo-form" autocomplete="off">
      <div class="input-wrapper">
        <input 
          type="text" 
          id="taskInput" 
          class="task-input" 
          placeholder="What do you need to do?" 
          aria-label="Add a new task"
          required
        >
        <button type="submit" class="btn btn-primary" id="addBtn" aria-label="Add task">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Add Task</span>
        </button>
      </div>
    </form>

    <!-- Filter & Control Bar -->
    <section class="controls-bar" aria-label="Task filters and summary">
      <div class="filter-tabs" role="tablist" aria-label="Task filters">
        <button class="filter-tab active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-tab" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-tab" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <div class="task-stats">
        <span id="itemsLeft" class="items-left">0 tasks</span>
      </div>
    </section>

    <!-- Task List -->
    <section class="task-list-section">
      <ul id="taskList" class="task-list" aria-label="To-do task list">
        <!-- Dynamic task items inserted by app.js -->
      </ul>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state">
        <div class="empty-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
        </div>
        <p class="empty-text">No tasks yet!</p>
        <p class="empty-subtext">Add a task above to get started.</p>
      </div>
    </section>

    <!-- Footer Actions -->
    <footer class="app-footer">
      <button id="clearCompletedBtn" class="btn btn-secondary btn-sm" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
        <span>Clear Completed</span>
      </button>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
